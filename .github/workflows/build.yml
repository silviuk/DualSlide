name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - name: Test Store publishing guards
        shell: pwsh
        run: ./tools/Test-StorePublishing.ps1
      - name: Check release version
        shell: pwsh
        run: |
          $info = [Diagnostics.FileVersionInfo]::GetVersionInfo((Join-Path $PWD 'dist/DualSlide.exe'))
          $version = '{0}.{1}.{2}' -f $info.FileMajorPart, $info.FileMinorPart, $info.FileBuildPart
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match executable version v$version"
          }
      - name: Run animation replay regression
        shell: pwsh
        timeout-minutes: 2
        run: |
          New-Item -ItemType Directory -Force .build | Out-Null
          ./test-build.ps1 -Source AnimationReplayTest.cs -Main AnimationReplayTest -Output .build/AnimationReplayTest.exe
          & ./.build/AnimationReplayTest.exe
          if ($LASTEXITCODE -ne 0) { throw 'Animation replay regression failed' }
      - name: Run pointer and application cleanup regressions
        shell: pwsh
        timeout-minutes: 2
        run: |
          foreach ($test in @('PointerRegressionTest', 'CleanupRegressionTest')) {
            ./test-build.ps1 -Source "$test.cs" -Main $test -Output (Join-Path $PWD ".build/$test.exe")
            & ".build/$test.exe"
            if ($LASTEXITCODE -ne 0) { throw "$test failed" }
          }
      - name: Package application
        shell: pwsh
        run: ./package.ps1
      - name: Package for Microsoft Store
        shell: pwsh
        run: ./build-msix.ps1
      - name: Upload package and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DualSlide-windows-x64
          path: |
            dist/DualSlide-*.zip
            dist/DualSlide-*.zip.sha256
            dist/DualSlide-*.msix
            dist/DualSlide-*.msix.sha256
          if-no-files-found: error

  release:
    name: Publish version tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download verified build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: DualSlide-windows-x64
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd artifacts
          sha256sum --check *.sha256
          gh release create "$RELEASE_TAG" *.zip *.msix *.sha256 --verify-tag --title "DualSlide ${RELEASE_TAG#v}" --notes-file ../RELEASE_NOTES.md
